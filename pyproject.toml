[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memo-exip"
version = "1.0.0"
description = "Adaptive Temporal Memory Management for LLM Agents Enhancement"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anshul Kumar Gupta" }
]
dependencies = [
    "pydantic>=2.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "chromadb>=0.5.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "memory*", "llm*", "evaluation*", "ui*"]
